name: Reliability and UI tests

on:
  push:
    branches:
      - main
      - feature/interview-reliability-and-tests
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install app and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r pi_agent/requirements.txt
          pip install pytest pytest-asyncio httpx
      - name: Run backend, agent and WebSocket tests
        run: python -m pytest tests/unit/backend tests/unit/agent tests/integration/backend -q

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci --prefix frontend
      - name: Run Vitest
        run: npm --prefix frontend run test:run
      - name: Ensure frontend builds
        run: npm --prefix frontend run build
